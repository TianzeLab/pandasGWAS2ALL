name: Sync Upstream Repos

on:
  workflow_dispatch:
    inputs:
      r_branch:
        description: '分支（pandasGWASr）'
        required: false
        default: 'master'
      python_branch:
        description: '分支（pandasGWAS2）'
        required: false
        default: 'main'
      commit_message:
        description: '提交信息'
        required: false
        default: 'chore: sync upstream repositories'

concurrency:
  group: sync-upstream
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 当前仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ------------------------------------------------------------
      # R 包：TianzeLab/pandasGWASr
      # ------------------------------------------------------------
      - name: 清空 R/ 目录
        run: |
          shopt -s dotglob nullglob
          rm -rf R/*
          mkdir -p R

      - name: 克隆 pandasGWASr 到临时目录
        run: |
          git clone --depth 1 --branch ${{ inputs.r_branch }} \
            https://github.com/TianzeLab/pandasGWASr.git /tmp/pandasGWASr

      - name: 复制 pandasGWASr 内容到 R/（排除 .git）
        run: |
          rsync -a --delete --exclude='.git' /tmp/pandasGWASr/ R/
          rm -rf /tmp/pandasGWASr

      # ------------------------------------------------------------
      # Python 包：TianzeLab/pandasGWAS2
      # ------------------------------------------------------------
      - name: 清空 Python/ 目录
        run: |
          shopt -s dotglob nullglob
          rm -rf Python/*
          mkdir -p Python

      - name: 克隆 pandasGWAS2 到临时目录
        run: |
          git clone --depth 1 --branch ${{ inputs.python_branch }} \
            https://github.com/TianzeLab/pandasGWAS2.git /tmp/pandasGWAS2

      - name: 复制 pandasGWAS2 内容到 Python/（排除 .git）
        run: |
          rsync -a --delete --exclude='.git' /tmp/pandasGWAS2/ Python/
          rm -rf /tmp/pandasGWAS2

      # ------------------------------------------------------------
      # 提交并推送
      # ------------------------------------------------------------
      - name: 查看变更状态
        run: git status --short

      - name: 提交变更
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "没有变更需要提交，跳过。"
          else
            git commit -m "${{ inputs.commit_message }}"
            git push origin HEAD:${{ github.ref_name }}
          fi
